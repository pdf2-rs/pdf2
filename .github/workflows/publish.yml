name: Publish

# Publishes workspace crates to crates.io with trusted publishing: the job
# proves its identity over OIDC, receives a short-lived token, and uploads. No
# crates.io API token is stored in GitHub secrets.
#
# Tags are per crate, and crates are always uploaded in dependency order
# (`pdf2` → `pdf2-render` → `pdf2-cli` / `pdf2-wasm`):
#
#   pdf2-v0.2.0-alpha.3
#   render-v0.1.0
#   cli-v0.1.0
#   wasm-v0.1.0
#
# A manual run can publish the whole train (`crate: all`), which skips every
# crate whose version is already on crates.io.
#
# Setup (one time, per crate, see docs/RELEASING.md):
#   crates.io -> <crate> -> Settings -> Trusted Publishing -> Add -> GitHub
#     repository owner: pdf2-rs
#     repository name:  pdf2
#     workflow file:    publish.yml
#     environment:      release
#   GitHub -> Settings -> Environments -> release (optionally with reviewers)

on:
  push:
    tags:
      - "pdf2-v*"
      - "render-v*"
      - "cli-v*"
      - "wasm-v*"
  workflow_dispatch:
    inputs:
      crate:
        description: "Which crates to publish, always in dependency order"
        type: choice
        options: [all, pdf2, render, cli, wasm]
        default: all
      dry_run:
        description: "Build and verify the packages without uploading"
        type: boolean
        default: true

permissions:
  contents: read

# One queue per tag: pushing several per-crate tags at once must not cancel the
# pending runs (a shared `publish` group does exactly that), while a re-run of
# the same tag still waits for the previous attempt.
concurrency:
  group: publish-${{ github.ref_name }}
  cancel-in-progress: false

env:
  # Tag prefix -> crate name, in dependency order.
  PUBLISH_ORDER: "pdf2:pdf2 render:pdf2-render cli:pdf2-cli wasm:pdf2-wasm"

jobs:
  publish:
    name: crates.io
    runs-on: ubuntu-latest
    # Matches the environment in every crate's trusted publisher configuration.
    # Protection rules here (required reviewers, deployment branches) apply
    # before a token is even requested.
    environment: release
    permissions:
      contents: read
      id-token: write # required for the OIDC exchange with crates.io

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      # `Cargo.lock` is not committed, and `cargo pkgid` (used below to read
      # each crate's version) refuses to run without one.
      - name: Resolve the workspace
        run: cargo +stable generate-lockfile

      - name: Check the tag or the manual selection
        id: plan
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main

          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            selection="${{ inputs.crate }}"
            if [ "$selection" = "all" ]; then
              echo "crates=${PUBLISH_ORDER}" >> "$GITHUB_OUTPUT"
            else
              entry="$(printf '%s\n' "$PUBLISH_ORDER" | tr ' ' '\n' | grep "^${selection}:")"
              echo "crates=${entry}" >> "$GITHUB_OUTPUT"
            fi
            echo "dry_run=${{ inputs.dry_run }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          tag="${GITHUB_REF_NAME}"
          prefix="${tag%%-v*}"
          crate="$(printf '%s\n' "$PUBLISH_ORDER" | tr ' ' '\n' | grep "^${prefix}:" | cut -d: -f2)"
          if [ -z "$crate" ]; then
            echo "::error::tag $tag does not name a known crate prefix"
            exit 1
          fi
          version="${tag#*-v}"
          # `cargo pkgid` prints path#version; the version is after the `#`.
          declared="$(cargo pkgid -p "${crate}" | sed 's/.*#//')"
          if [ "$version" != "$declared" ]; then
            echo "::error::tag $tag does not match $crate version $declared"
            exit 1
          fi
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "::error::tag $tag is not on main"
            exit 1
          }
          echo "crates=${prefix}:${crate}" >> "$GITHUB_OUTPUT"
          echo "dry_run=false" >> "$GITHUB_OUTPUT"
          echo "publishing $crate $version from $tag"

      - name: Test before publishing
        run: cargo +stable test --workspace

      - name: Exchange the OIDC token for a crates.io token
        if: steps.plan.outputs.dry_run != 'true'
        id: auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          set -euo pipefail
          dry_run="${{ steps.plan.outputs.dry_run }}"
          for entry in ${{ steps.plan.outputs.crates }}; do
            crate="${entry#*:}"
            version="$(cargo pkgid -p "${crate}" | sed 's/.*#//')"
            status="$(curl -s -o /dev/null -w "%{http_code}" -A "pdf2-release" \
              "https://crates.io/api/v1/crates/${crate}/${version}")"
            # A dry run verifies packaging even for versions already released,
            # so only a real run skips them.
            if [ "$dry_run" != "true" ] && [ "$status" = "200" ]; then
              echo "skip ${crate} ${version}: already on crates.io"
              continue
            fi
            echo "publishing ${crate} ${version}"
            if [ "$dry_run" = "true" ]; then
              cargo +stable publish --dry-run -p "${crate}"
            else
              cargo +stable publish -p "${crate}"
            fi
          done
