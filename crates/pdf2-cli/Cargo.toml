[package]
name = "pdf2-cli"
version = "1.3.0"
edition = "2024"
rust-version = "1.100"
description = "Command-line front end for the pdf2 crate: inspect PDF 2.0 files."
license = "Unlicense OR MIT"
repository = "https://github.com/pdf2-rs/pdf2"
readme = "README.md"
keywords = ["pdf", "pdf2", "cli"]
categories = ["command-line-utilities"]

# The package is named pdf2-cli but the command is `pdf2`. The explicit bin name
# is also what makes `CARGO_BIN_EXE_pdf2` available to the integration tests.
[[bin]]
name = "pdf2"
path = "src/main.rs"

[dependencies]
pdf2 = { path = "../..", version = "1.3.0" }

[lints]
workspace = true
