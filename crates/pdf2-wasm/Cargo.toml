[package]
name = "pdf2-wasm"
version.workspace = true
edition = "2024"
rust-version = "1.100"
description = "WebAssembly bindings for pdf2: open, inspect and render PDF 2.0 pages in the browser."
license = "Unlicense OR MIT"
repository = "https://github.com/pdf2-rs/pdf2"
homepage = "https://pdf2-rs.github.io/pdf2/"
readme = "README.md"
keywords = ["pdf", "pdf2", "wasm", "render"]
categories = ["wasm", "graphics"]

[features]
default = []
# Pass-through only: the decoders stay off for the npm package, and the demo
# build turns them on. Declaring them as `pdf2-render/…` keeps `dct` enabled,
# which re-declaring the dependency with `default-features = false` would not.
jpx = ["pdf2-render/jpx"]
jbig2 = ["pdf2-render/jbig2"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
pdf2 = { path = "../..", version = "1.6.0" }
pdf2-render = { path = "../pdf2-render", version = "1.6.0" }
# Pinned to the wasm-bindgen CLI version used locally and in CI: the bindgen
# schema is not compatible across versions.
wasm-bindgen = "=0.2.127"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "CanvasRenderingContext2d",
    "HtmlCanvasElement",
    "ImageData",
] }

[lints]
workspace = true
