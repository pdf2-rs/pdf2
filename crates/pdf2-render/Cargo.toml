[package]
name = "pdf2-render"
version = "1.4.0"
edition = "2024"
rust-version = "1.100"
description = "Rasteriser for the pdf2 crate: paths, clips, transforms and (soon) images and text."
license = "Unlicense OR MIT"
repository = "https://github.com/pdf2-rs/pdf2"
readme = "README.md"
keywords = ["pdf", "pdf2", "render", "raster"]
categories = ["graphics"]

[features]
default = ["dct"]
# `/DCTDecode` (JPEG) images, through `zune-jpeg`: MSRV 1.75, `MIT OR Apache-2.0
# OR Zlib`, already on `deny.toml`'s allow-list. Off only for a caller that would
# rather not pay the wasm bytes for an image codec.
dct = ["dep:zune-jpeg"]

[dependencies]
miniz_oxide = "0.9"
pdf2 = { path = "../..", version = "1.4.0" }
ttf-parser = "0.25.1"
zune-jpeg = { version = "0.5.15", optional = true }

[lints]
workspace = true
