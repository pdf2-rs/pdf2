[package]
name = "pdf2"
# The one version for the whole shipped group: every published crate inherits
# it, so the library, the renderer, the CLI and the wasm package cannot drift
# apart. `crates/pdf2-wasm/package.json` is the one copy Cargo cannot reach; the
# `versions` chore in the gate keeps it honest.
version.workspace = true
authors = ["Alexander Korolev <alexander.korolev.germany@gmail.com>"]
edition = "2024"
categories = ["parser-implementations", "text-processing"]
description = "A PDF 2.0 (ISO 32000-2) reader, writer and text extractor."
homepage = "https://pdf2-rs.github.io/pdf2/"
keywords = ["pdf", "pdf2", "parser", "writer", "iso32000"]
# Verified by the `1.100` job in .github/workflows/ci.yml.
rust-version = "1.100"
license = "Unlicense OR MIT"
readme = "README.md"
# The corpus is evidence, not shipped code: it must never travel in the crate.
# The committed corpus and the vendored CMap sources are inputs to the build and
# to the generated data, not part of what a reader of the crate needs: shipping
# 174 kB of Adobe CMap sources beside the 20 kB table they generate would be
# dead weight in every download.
exclude = ["corpus", "vendor"]
repository = "https://github.com/pdf2-rs/pdf2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = ["std"]
# File-system convenience APIs (`Document::open_path`, `save_to_path`) and the
# `std::io::Error` conversion. Everything else works without `std`.
std = []
# The `no_std` build: core + alloc, no file system, no standard library.
alloc = []

[lints]
workspace = true

[dev-dependencies]
# The library decodes Flate with this crate already; the bounds tests build a
# decompression bomb with the same one rather than embedding a compressed blob.
miniz_oxide = "0.9"

[dependencies]
aes = { version = "0.8.4", default-features = false }
cbc = { version = "0.1.2", default-features = false, features = ["block-padding"] }
# Inflate/deflate without std; replaces `flate2`, whose read/write adapters
# need `std::io`.
miniz_oxide = "0.9"
sha2 = { version = "0.10.9", default-features = false }

# The repository root is both the `pdf2` package and the workspace root, so the
# library keeps its paths and no source has to move. Tools live under crates/.
[workspace]
members = [
    "crates/xtask",
    "crates/pdf2-oracle",
    "crates/pdf2-bench",
    "crates/pdf2-cli",
    "crates/pdf2-render",
    "crates/pdf2-wasm",
    "crates/pdf2-wasm-smoke",
]
# The Rust-version-aware resolver (edition 2024's default). It prefers dependency
# versions whose `rust-version` fits ours, so a fresh `Cargo.lock` cannot pick a
# crate that needs a newer compiler than the MSRV declares. Recorded rather than
# inferred: `Cargo.lock` is git-ignored, so the setting is the only thing that
# tells the next person why resolution behaves this way.
resolver = "3"

[workspace.package]
# Bumped for every release of the group — library, renderer, CLI, wasm crate and
# npm package all carry this number. `cargo run -q -p xtask -- versions` proves
# nothing has drifted; the gate runs it.
version = "1.9.0"

# Lint policy for every crate, so it holds in `cargo build` and `cargo test`
# too, not only when someone remembers the flags CI uses. Keep this equal to
# what the Gate job runs: `cargo clippy --workspace --all-targets -- -D warnings`.
# `unsafe_code` is denied rather than forbidden so that the two crates that
# genuinely need it (the counting allocator and the C ABI in the wasm smoke
# crate) can allow it locally, with a comment, instead of silently.
[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
