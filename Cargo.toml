[package]
name = "pdf2"
version = "0.2.0-alpha.1"
authors = ["Alexander Korolev <alexander.korolev.germany@gmail.com>"]
edition = "2021"
categories = ["parser-implementations", "text-processing"]
description = "A PDF 2.0 (ISO 32000-2) reader, writer and text extractor."
homepage = "https://github.com/pdf2-rs/pdf2"
keywords = ["pdf", "pdf2", "parser", "writer", "iso32000"]
# Verified by the `1.87` job in .github/workflows/ci.yml.
rust-version = "1.87"
license = "Unlicense OR MIT"
readme = "README.md"
changelog = "https://github.com/pdf2-rs/pdf2/blob/main/CHANGELOG.md"
repository = "https://github.com/pdf2-rs/pdf2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
aes = "0.8.4"
cbc = "0.1.2"
flate2 = "1.1.11"
sha2 = "0.10.9"
