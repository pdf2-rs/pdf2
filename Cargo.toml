[package]
name = "pdf2"
version = "0.2.0-alpha.2"
authors = ["Alexander Korolev <alexander.korolev.germany@gmail.com>"]
edition = "2021"
categories = ["parser-implementations", "text-processing"]
description = "A PDF 2.0 (ISO 32000-2) reader, writer and text extractor."
homepage = "https://github.com/pdf2-rs/pdf2"
keywords = ["pdf", "pdf2", "parser", "writer", "iso32000"]
# Verified by the `1.87` job in .github/workflows/ci.yml.
rust-version = "1.87"
license = "Unlicense OR MIT"
readme = "README.md"
repository = "https://github.com/pdf2-rs/pdf2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = ["std"]
# File-system convenience APIs (`Document::open_path`, `save_to_path`) and the
# `std::io::Error` conversion. Everything else works without `std`.
std = []
# The `no_std` build: core + alloc, no file system, no standard library.
alloc = []

[dependencies]
aes = { version = "0.8.4", default-features = false }
cbc = { version = "0.1.2", default-features = false, features = ["block-padding"] }
# Inflate/deflate without std; replaces `flate2`, whose read/write adapters
# need `std::io`.
miniz_oxide = "0.9"
sha2 = { version = "0.10.9", default-features = false }

# The repository root is both the `pdf2` package and the workspace root, so the
# library keeps its paths and no source has to move. Tools live under crates/.
[workspace]
members = [
    "crates/pdf2-bench",
    "crates/pdf2-cli",
    "crates/pdf2-render",
    "crates/pdf2-wasm",
    "crates/pdf2-wasm-smoke",
]
resolver = "2"
